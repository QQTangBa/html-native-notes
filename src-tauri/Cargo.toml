[package]
name = "html-native-notes"
version = "0.1.0"
description = "HTML Native Notes desktop shell"
authors = ["HTML Native Notes contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "html_native_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
